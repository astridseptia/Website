<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login Admin — Semparuk Sutera</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

:root{
    --primary:#008fd5;
    --secondary:#39d6c5;
    --accent:#8ff5df;

    --bg:#eafbf8;
    --card:#ffffff;

    --text:#173b4d;
    --muted:#66808c;

    --navy:#063b52;

    --border:rgba(0,143,213,.13);

    --shadow:
        0 20px 50px rgba(0,100,150,.14);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    font-family:"Inter",sans-serif;

    background:
        radial-gradient(
            circle at top right,
            rgba(57,214,197,.25),
            transparent 35%
        ),
        var(--bg);

    color:var(--text);
}


/* =========================
   LOGIN CARD
========================= */

.login-card{

    width:100%;
    max-width:420px;

    background:var(--card);

    border:1px solid var(--border);

    border-radius:24px;

    padding:38px;

    box-shadow:var(--shadow);

}


/* =========================
   LOGO
========================= */

.logo{

    text-align:center;

    margin-bottom:30px;
}

.logo-icon{

    width:65px;
    height:65px;

    margin:0 auto 15px;

    border-radius:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;

    font-size:25px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--secondary)
        );

    box-shadow:
        0 10px 25px rgba(0,143,213,.2);
}

.logo h1{

    font-size:24px;

    font-weight:800;

    margin-bottom:6px;
}

.logo h1 span{

    color:var(--primary);
}

.logo p{

    font-size:13px;

    color:var(--muted);
}


/* =========================
   FORM
========================= */

.form-group{

    margin-bottom:18px;
}

.form-group label{

    display:block;

    font-size:13px;

    font-weight:700;

    margin-bottom:8px;
}

.input-wrapper{

    position:relative;
}

.input-wrapper i{

    position:absolute;

    left:15px;
    top:50%;

    transform:translateY(-50%);

    color:var(--muted);

    font-size:14px;
}

.input-wrapper input{

    width:100%;

    height:50px;

    padding:
        0 15px
        0 43px;

    border-radius:12px;

    border:1px solid var(--border);

    outline:none;

    font-family:inherit;

    color:var(--text);

    background:white;

    transition:.25s;
}

.input-wrapper input:focus{

    border-color:var(--primary);

    box-shadow:
        0 0 0 3px
        rgba(0,143,213,.1);
}


/* =========================
   LOGIN BUTTON
========================= */

.login-btn{

    width:100%;

    height:50px;

    border:0;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            var(--primary),
            var(--secondary)
        );

    color:white;

    font-family:inherit;

    font-size:14px;

    font-weight:700;

    cursor:pointer;

    transition:.25s;

    margin-top:5px;
}

.login-btn:hover{

    transform:translateY(-2px);

    box-shadow:
        0 10px 25px
        rgba(0,143,213,.2);
}


/* =========================
   ERROR
========================= */

.error{

    display:none;

    margin-bottom:18px;

    padding:12px 14px;

    border-radius:10px;

    background:#ffe8ec;

    color:#d43d4f;

    font-size:12px;

    line-height:1.5;
}

.error.show{

    display:block;
}


/* =========================
   BACK
========================= */

.back{

    display:block;

    text-align:center;

    margin-top:22px;

    color:var(--muted);

    text-decoration:none;

    font-size:12px;
}

.back:hover{

    color:var(--primary);
}

</style>

</head>


<body>


<div class="login-card">


    <div class="logo">

        <div class="logo-icon">

            <i class="fa-solid fa-user-shield"></i>

        </div>


        <h1>
            Login <span>Admin</span>
        </h1>

        <p>
            Panel Administrasi Semparuk Sutera
        </p>

    </div>



    <div
        class="error"
        id="error">

        Username atau password salah.

    </div>



    <form id="loginForm">


        <div class="form-group">

            <label for="username">
                Username
            </label>

            <div class="input-wrapper">

                <i class="fa-solid fa-user"></i>

                <input
                    type="text"
                    id="username"
                    placeholder="Masukkan username"
                    autocomplete="username"
                    required>

            </div>

        </div>



        <div class="form-group">

            <label for="password">
                Password
            </label>

            <div class="input-wrapper">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="password"
                    placeholder="Masukkan password"
                    autocomplete="current-password"
                    required>

            </div>

        </div>



        <button
            type="submit"
            class="login-btn">

            <i class="fa-solid fa-right-to-bracket"></i>

            Masuk ke Dashboard

        </button>


    </form>



    <a
        href="index.html"
        class="back">

        <i class="fa-solid fa-arrow-left"></i>

        Kembali ke Website

    </a>


</div>



<script>

/* =========================================
   LOGIN ADMIN
========================================= */

/*
   GANTI username dan password di bawah.
*/

const ADMIN_USERNAME = "admin";

const ADMIN_PASSWORD = "astrid123";


document
.getElementById("loginForm")
.addEventListener(
    "submit",
    function(e){

        e.preventDefault();


        const username =
            document
            .getElementById("username")
            .value
            .trim();


        const password =
            document
            .getElementById("password")
            .value;


        const error =
            document
            .getElementById("error");


        if(
            username === ADMIN_USERNAME &&
            password === ADMIN_PASSWORD
        ){

            /*
             * Tandai bahwa admin
             * sudah login.
             */

            sessionStorage.setItem(
                "adminLoggedIn",
                "true"
            );


            /*
             * Masuk dashboard.
             */

            window.location.href =
                "admin.html";

        }else{

            error.classList.add("show");

        }

    }
);

</script>


</body>

</html>
